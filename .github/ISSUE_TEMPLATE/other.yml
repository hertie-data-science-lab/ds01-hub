name: Other
description: Something that doesn't fit the other categories
title: "[OTHER] "
labels: ["other"]
body:
  - type: markdown
    attributes:
      value: |
        Couldn't find a category that fits? No problem — tell us what's on your mind.

        **This tracker is public.** Don't paste passwords, tokens, or personal data - yours or anyone else's. Your Hertie email is the exception: it's removed from the ticket automatically once it reaches the lab.

  - type: input
    id: email
    attributes:
      label: Hertie email
      description: Your @hertie-school.org or @students.hertie-school.org email. Used only to copy you on this ticket, then removed from the public issue.
      placeholder: <user-id>@hertie-school.org
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: What's this about?
      description: Describe your issue, request, or topic
      placeholder: Tell us what you need...
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Any additional context
      description: Anything else that might be helpful
    validations:
      required: false
